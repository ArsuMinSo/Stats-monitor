<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Omnika — Přehled výroby</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #12161B;
    --surface: #1B2129;
    --surface-2: #232A33;
    --border: #2B333D;
    --text: #EDEFF2;
    --text-dim: #7E8A97;
    --green: #4CAF6D;
    --green-dim: #2C4A38;
    --amber: #E3A73C;
    --amber-dim: #4A3D22;
    --red: #E0524A;
    --red-dim: #4A2926;
    --steel: #6C9BC4;
    --font-ui: 'Space Grotesk', sans-serif;
    --font-num: 'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    -webkit-font-smoothing: antialiased;
    overflow-x:hidden;
  }
  .app{ min-height:100vh; display:flex; flex-direction:column; }

  /* ---------- header ---------- */
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding: 22px 32px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    gap: 12px;
  }
  .brand{ display:flex; align-items:baseline; gap:14px; }
  .brand .mark{
    font-family: var(--font-num);
    font-weight:700;
    font-size: 15px;
    color: var(--steel);
    letter-spacing: 0.02em;
  }
  .brand h1{ font-size: 20px; font-weight:600; }
  .crumb{ font-size:14px; color:var(--text-dim); display:flex; align-items:center; gap:8px; }
  .crumb button{
    background:none; border:none; color:var(--steel); font-family:var(--font-ui);
    font-size:14px; cursor:pointer; padding:0;
  }
  .crumb button:hover{ text-decoration: underline; }
  .clock{ font-family: var(--font-num); font-size:14px; color:var(--text-dim); text-align:right; }

  main{ flex:1; padding: 28px 32px 40px; }

  /* ---------- home: středisko grid ---------- */
  .section-label{
    font-size: 13px; color: var(--text-dim); margin-bottom:16px;
  }
  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 14px;
  }
  .tile{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 18px;
    cursor:pointer;
    text-align:left;
    color: var(--text);
    font-family: var(--font-ui);
    transition: border-color .15s ease, transform .1s ease;
    position:relative;
    overflow:hidden;
  }
  .tile:hover{ border-color: var(--steel); transform: translateY(-1px); }
  .tile:focus-visible{ outline: 2px solid var(--steel); outline-offset: 2px; }
  .tile::before{
    content:''; position:absolute; left:0; top:0; bottom:0; width:4px;
  }
  .tile.status-green::before{ background: var(--green); }
  .tile.status-amber::before{ background: var(--amber); }
  .tile.status-red::before{ background: var(--red); }

  .tile-code{ font-family: var(--font-num); font-size:22px; font-weight:600; }
  .tile-name{ font-size:13px; color: var(--text-dim); margin-top:2px; margin-bottom:14px; }

  .bars{ display:flex; align-items:flex-end; gap:3px; height:28px; margin-bottom:10px; }
  .bars span{ flex:1; border-radius:1px; }
  .status-green .bars span{ background: var(--green); }
  .status-amber .bars span{ background: var(--amber); }
  .status-red .bars span{ background: var(--red); }

  .tile-pct{ font-family: var(--font-num); font-size:15px; font-weight:600; }
  .tile-pct small{ font-family: var(--font-ui); font-weight:400; color: var(--text-dim); font-size:12px; }

  /* ---------- operations grid ---------- */
  .op-tile{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 16px;
    cursor:pointer;
    text-align:left;
    color: var(--text);
    font-family: var(--font-ui);
    display:flex; flex-direction:column; gap:10px;
  }
  .op-tile:hover{ border-color: var(--steel); }
  .op-code{ font-family: var(--font-num); font-size:16px; font-weight:600; display:flex; align-items:center; gap:8px; }
  .dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .dot.status-green{ background: var(--green); }
  .dot.status-amber{ background: var(--amber); }
  .dot.status-red{ background: var(--red); }
  .op-track{ height:6px; background: var(--surface-2); border-radius:3px; overflow:hidden; }
  .op-track div{ height:100%; border-radius:3px; }
  .status-green .op-track div, .op-track div.status-green{ background: var(--green); }
  .op-meta{ font-family:var(--font-num); font-size:12px; color:var(--text-dim); display:flex; justify-content:space-between; }

  /* ---------- graph view ---------- */
  .graph-header{ display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:24px; margin-bottom: 24px; }
  .graph-title{ font-size:22px; font-weight:600; }
  .graph-sub{ font-size:13px; color:var(--text-dim); margin-top:4px; }

  .stat-row{ display:flex; gap: 28px; flex-wrap:wrap; margin-bottom: 28px; }
  .stat{ background: var(--surface); border:1px solid var(--border); border-radius:6px; padding: 16px 20px; min-width:150px; }
  .stat-label{ font-size:12px; color:var(--text-dim); margin-bottom:6px; }
  .stat-value{ font-family: var(--font-num); font-size:28px; font-weight:600; }
  .stat-value.green{ color: var(--green); }
  .stat-value.amber{ color: var(--amber); }
  .stat-value.red{ color: var(--red); }
  .stat-unit{ font-size:14px; color:var(--text-dim); font-weight:400; }

  .badge{
    display:inline-flex; align-items:center; gap:6px;
    font-family: var(--font-num); font-size:13px; font-weight:600;
    padding: 6px 12px; border-radius:4px;
  }
  .badge.status-green{ background: var(--green-dim); color: var(--green); }
  .badge.status-amber{ background: var(--amber-dim); color: var(--amber); }
  .badge.status-red{ background: var(--red-dim); color: var(--red); }

  .chart-card{
    background: var(--surface); border:1px solid var(--border); border-radius:6px;
    padding: 24px; margin-bottom: 20px;
  }
  .chart-legend{ display:flex; gap:24px; margin-bottom:16px; font-size:13px; color:var(--text); flex-wrap:wrap; }
  .chart-legend span{ display:inline-flex; align-items:center; gap:8px; }
  .swatch{ width:22px; height:0; border-top:3px solid var(--steel); display:inline-block; flex-shrink:0; }
  .swatch.actual{ border-top-style:solid; border-color: var(--steel); }
  .swatch.pace{ border-top-style:dashed; border-color: var(--text-dim); }
  .swatch.target{ border-top-style:dashed; border-width:2px; border-color: var(--text-dim); }

  .stale{ font-family: var(--font-num); font-size:12px; color: var(--text-dim); }

  /* ---------- aktuální tempo dial ---------- */
  .dial-card{
    background: var(--surface); border:1px solid var(--border); border-radius:6px;
    padding: 24px; margin-bottom: 20px;
    display:flex; align-items:center; gap:32px; flex-wrap:wrap;
  }
  .dial-card svg{ flex-shrink:0; }
  .dial-readout .stat-label{ font-size:12px; color:var(--text-dim); margin-bottom:6px; }
  .dial-readout .big{ font-family: var(--font-num); font-size:34px; font-weight:600; }
  .dial-readout .big.green{ color: var(--green); }
  .dial-readout .big.amber{ color: var(--amber); }
  .dial-readout .big.red{ color: var(--red); }
  .dial-readout .sub{ font-family: var(--font-num); font-size:13px; color:var(--text-dim); margin-top:6px; }

  @media (max-width: 600px){
    header, main{ padding-left:18px; padding-right:18px; }
    .stat-row{ gap:12px; }
    .stat{ min-width: 130px; padding: 12px 14px; }
    .stat-value{ font-size:22px; }
  }

  /* ---------- print: light theme, minimal toner ---------- */
  @media print{
    :root{
      --bg: #ffffff;
      --surface: #ffffff;
      --surface-2: #e0e0e0;
      --border: #666666;
      --text: #000000;
      --text-dim: #222222;
      --green: #16702F;
      --green-dim: #DCEBE0;
      --amber: #7A5200;
      --amber-dim: #EFE4CC;
      --red: #A5241C;
      --red-dim: #EFD6D3;
      --steel: #0B3C5D;
    }
    *{ -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body{ background:#fff !important; color:#000 !important; }
    .app{ min-height:0; }
    .tile, .op-tile, .stat, .chart-card, .dial-card{
      background:#fff !important;
      box-shadow:none !important;
      transform:none !important;
      border-color:#666 !important;
    }
    .tile, .op-tile, .stat, .dial-card{ break-inside: avoid; }
    /* chart is tall: give it its own page so Chrome doesn't crush it to fit */
    .chart-card{ break-before: page; padding:12px 0 !important; border:none !important; }
    #chart-holder{ width:100%; }
    #chart-holder svg{ width:100% !important; height:auto !important; }
    header{ padding:12px 0; border-color:#666; }
    main{ padding:16px 0; }
    .clock{ display:none; }

    /* force real ink on the data itself */
    .stat-value, .stat-value.green, .stat-value.amber, .stat-value.red,
    .dial-readout .big, .tile-code, .tile-pct, .op-code, .graph-title{ color:#000 !important; }
    .stat-label, .stat-unit, .op-meta, .graph-sub, .stale, .chart-legend,
    .tile-name, .tile-pct small, .section-label, .crumb{ color:#222 !important; }
    .badge{ border:1px solid #000; }

    /* chart: thin coloured strokes vanish on paper — make them black and heavier */
    .chart-card svg path{ stroke:#000 !important; stroke-width:2.6 !important; }
    .chart-card svg line{ stroke:#000 !important; stroke-opacity:1 !important; stroke-width:1 !important; }
    .chart-card svg circle{ fill:#000 !important; }
    .chart-card svg text{ fill:#000 !important; font-size:16px !important; font-weight:600 !important; }
    .chart-legend .swatch{ border-color:#000 !important; opacity:1 !important; }

    /* dial: keep the coloured arc, darken the rest */
    .dial-card svg line, .dial-card svg circle:last-of-type{ stroke:#000 !important; fill:#000 !important; }
    .dial-card svg text{ fill:#222 !important; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <span class="mark">OMNIKA</span>
      <h1 id="header-title">Výroba — přehled středisek</h1>
    </div>
    <div class="clock" id="clock"></div>
  </header>

  <div id="crumb-wrap" style="padding: 14px 32px 0;"></div>

  <main id="main"></main>
</div>

<script>
/* ---------------- mock data ---------------- */
const STREDISKA = [
  { code:'01', name:'Horizontální žaluzie',     ops: genOps('01', ['1','2','3','4', '5', '6', '99.2', '99.3']) },
  { code:'02', name:'Vertikální žaluzie',       ops: genOps('02', ['1','2','3', '99.2']) },
  { code:'04', name:'Panely',                   ops: genOps('04', ['1','2','3', '99.2']) },
  { code:'05', name:'Rolety',                   ops: genOps('05', ['1','2','3','3.1','4','5','6','7','9']) },
  { code:'06', name:'Plisse',                   ops: genOps('06', ['1.1.1','1.1.2','1.2','2.1','2.2','3.1','4.1','5.1','6.1','7.1','99.2']) },
  { code:'07', name:'Dítě proti hmyzu',         ops: genOps('07', ['1','99.2','Insect screens - Balení']) },
  { code:'13', name:'Dřevěné žaluzie',          ops: genOps('13', ['01','02','03']) },
  { code:'17', name:'Kompletace - sady',        ops: genOps('17', ['00']) },
  { code:'56', name:'Venkovní rolety',          ops: genOps('56', ['1','2','3','4','9']) },
  { code:'63', name:'Woven wood',               ops: genOps('63', ['1','2','3','4','5','99.2']) },
  { code:'93', name:'Expedice',                 ops: genOps('93', ['00']) },
  { code:'99', name:'Společná pracoviště',      ops: genOps('99', ['Balení','EC','EC - Předbal','Magnety','Rapid','Sklad']) },
];

function genOps(stredisko, suffixes){
  return suffixes.map(s => {
    const code = stredisko + '_' + s;
    const target = 60 + Math.floor(Math.random()*200);
    const shiftProgress = 0.4 + Math.random()*0.5; // how far into shift we mock as
    const idealAtNow = target * shiftProgress;
    const noise = (Math.random()-0.45) * target * 0.35;
    const produced = Math.max(0, Math.round(idealAtNow + noise));
    return { code, target, produced, shiftProgress };
  });
}

function status(produced, target, shiftProgress){
  const idealAtNow = target * shiftProgress;
  if (idealAtNow <= 0) return 'green';
  const ratio = produced / idealAtNow;
  if (ratio >= 0.95) return 'green';
  if (ratio >= 0.8) return 'amber';
  return 'red';
}

function stredisko_status(s){
  const statuses = s.ops.map(o => status(o.produced, o.target, o.shiftProgress));
  if (statuses.includes('red')) return 'red';
  if (statuses.includes('amber')) return 'amber';
  return 'green';
}

function needPace(produced, target, shiftProgress){
  // remaining hours mocked as (1 - shiftProgress) * 8h shift
  const remainingHours = Math.max(0.25, (1 - shiftProgress) * 8);
  const remainingQty = target - produced;
  return remainingQty / remainingHours;
}

function currentPace(produced, shiftProgress){
  // pace achieved so far this shift, ks/h
  const elapsedHours = Math.max(0.25, shiftProgress * 8);
  return produced / elapsedHours;
}

function paceStatus(cur, need){
  if (need <= 0) return 'green';
  const ratio = cur / need;
  if (ratio >= 0.95) return 'green';
  if (ratio >= 0.8) return 'amber';
  return 'red';
}

/* ---------------- routing / view state ---------------- */
let view = { screen: 'home', stredisko: null, op: null };
const main = document.getElementById('main');
const crumbWrap = document.getElementById('crumb-wrap');
const headerTitle = document.getElementById('header-title');

function render(){
  crumbWrap.innerHTML = '';
  if (view.screen === 'home'){
    headerTitle.textContent = 'Výroba — přehled středisek';
    renderHome();
  } else if (view.screen === 'ops'){
    const s = STREDISKA.find(x => x.code === view.stredisko);
    headerTitle.textContent = 'Středisko ' + s.code + ' — ' + s.name;
    renderCrumb([{label:'Přehled', go:{screen:'home'}}, {label:'Středisko ' + s.code}]);
    renderOps(s);
  } else if (view.screen === 'graph'){
    const s = STREDISKA.find(x => x.code === view.stredisko);
    const o = s.ops.find(x => x.code === view.op);
    headerTitle.textContent = o.code;
    renderCrumb([
      {label:'Přehled', go:{screen:'home'}},
      {label:'Středisko ' + s.code, go:{screen:'ops', stredisko: s.code}},
      {label: o.code}
    ]);
    renderGraph(s, o);
  }
}

function renderCrumb(items){
  const wrap = document.createElement('div');
  wrap.className = 'crumb';
  items.forEach((it, i) => {
    if (i > 0){
      const sep = document.createElement('span');
      sep.textContent = '/';
      wrap.appendChild(sep);
    }
    if (it.go){
      const btn = document.createElement('button');
      btn.textContent = it.label;
      btn.onclick = () => { view = {...view, ...it.go}; render(); };
      wrap.appendChild(btn);
    } else {
      const span = document.createElement('span');
      span.textContent = it.label;
      span.style.color = 'var(--text)';
      wrap.appendChild(span);
    }
  });
  crumbWrap.appendChild(wrap);
}

function renderHome(){
  main.innerHTML = '';
  const label = document.createElement('div');
  label.className = 'section-label';
  label.textContent = STREDISKA.length + ' středisek — dnešní směna';
  main.appendChild(label);

  const grid = document.createElement('div');
  grid.className = 'grid';

  STREDISKA.forEach(s => {
    const totalProduced = s.ops.reduce((a,o)=>a+o.produced,0);
    const totalTarget = s.ops.reduce((a,o)=>a+o.target,0);
    const pct = Math.round((totalProduced/totalTarget)*100);
    const st = stredisko_status(s);

    const tile = document.createElement('button');
    tile.className = 'tile status-' + st;
    tile.innerHTML = `
      <div class="tile-code">${s.code}</div>
      <div class="tile-name">${s.name}</div>
      <div class="bars">${s.ops.map(o => {
        const h = Math.max(8, Math.min(100, Math.round((o.produced/o.target)*100)));
        return `<span style="height:${h}%"></span>`;
      }).join('')}</div>
      <div class="tile-pct">${pct}% <small>plánu k této chvíli</small></div>
    `;
    tile.onclick = () => { view = { screen:'ops', stredisko: s.code, op:null }; render(); };
    grid.appendChild(tile);
  });

  main.appendChild(grid);
}

function renderOps(s){
  main.innerHTML = '';
  const label = document.createElement('div');
  label.className = 'section-label';
  label.textContent = s.ops.length + ' operací';
  main.appendChild(label);

  const grid = document.createElement('div');
  grid.className = 'grid';

  s.ops.forEach(o => {
    const st = status(o.produced, o.target, o.shiftProgress);
    const pct = Math.min(100, Math.round((o.produced/o.target)*100));
    const tile = document.createElement('button');
    tile.className = 'op-tile';
    tile.innerHTML = `
      <div class="op-code"><span class="dot status-${st}"></span>${o.code}</div>
      <div class="op-track"><div class="status-${st}" style="width:${pct}%"></div></div>
      <div class="op-meta"><span>${o.produced} / ${o.target} ks</span><span>${pct}%</span></div>
    `;
    tile.onclick = () => { view = { screen:'graph', stredisko: s.code, op: o.code }; render(); };
    grid.appendChild(tile);
  });

  main.appendChild(grid);
}

function renderGraph(s, o){
  main.innerHTML = '';
  const st = status(o.produced, o.target, o.shiftProgress);
  const pace = needPace(o.produced, o.target, o.shiftProgress);
  const cur = currentPace(o.produced, o.shiftProgress);
  const pst = paceStatus(cur, pace);
  const statusText = { green:'V plánu', amber:'Mírně pozadu', red:'Pozadu' }[st];

  const header = document.createElement('div');
  header.className = 'graph-header';
  header.innerHTML = `
    <div>
      <div class="graph-title">${o.code} <span class="badge status-${st}">${statusText}</span></div>
      <div class="graph-sub">Středisko ${s.code} · ${s.name}</div>
    </div>
    <div class="stale">Data aktualizována před 2 min</div>
  `;
  main.appendChild(header);

  const statRow = document.createElement('div');
  statRow.className = 'stat-row';
  statRow.innerHTML = `
    <div class="stat">
      <div class="stat-label">Vyrobeno dnes</div>
      <div class="stat-value">${o.produced} <span class="stat-unit">ks</span></div>
    </div>
    <div class="stat">
      <div class="stat-label">Denní kvóta</div>
      <div class="stat-value">${o.target} <span class="stat-unit">ks</span></div>
    </div>
    <div class="stat">
      <div class="stat-label">Potřebné tempo</div>
      <div class="stat-value">${Math.max(0, pace).toFixed(1)} <span class="stat-unit">ks/h</span></div>
    </div>
  `;
  main.appendChild(statRow);

  const dialCard = document.createElement('div');
  dialCard.className = 'dial-card';
  const diff = cur - pace;
  const verdict = { green:'Lze zvolnit', amber:'Držet tempo', red:'Pozadu — přidat' }[pst];
  const diffText = Math.abs(diff) < 0.05
    ? 'přesně na potřebném tempu'
    : `${diff > 0 ? '+' : ''}${diff.toFixed(1)} ks/h vs. potřeba`;
  dialCard.innerHTML = `
    <div id="dial-holder"></div>
    <div class="dial-readout">
      <div class="big ${pst}">${verdict}</div>
      <div class="sub">${cur.toFixed(1)} ks/h · cíl ${Math.max(0, pace).toFixed(1)} ks/h · ${diffText}</div>
    </div>
  `;
  main.appendChild(dialCard);
  drawDial(document.getElementById('dial-holder'), cur, Math.max(0, pace), pst);

  const chartCard = document.createElement('div');
  chartCard.className = 'chart-card';
  chartCard.innerHTML = `
    <div class="chart-legend">
      <span><span class="swatch actual"></span>Skutečnost</span>
      <span><span class="swatch pace"></span>Ideální tempo</span>
      <span><span class="swatch target"></span>Denní kvóta</span>
    </div>
    <div id="chart-holder"></div>
  `;
  main.appendChild(chartCard);
  drawChart(document.getElementById('chart-holder'), o);
}

function niceStep(range, count){
  const raw = range / count;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const norm = raw / mag;
  const step = norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10;
  return step * mag;
}

function drawChart(holder, o){
  const w = Math.max(320, holder.clientWidth || 600);
  const h = 340;
  const pad = { l: 74, r: 32, t: 26, b: 52 };
  const hours = 8;
  const nowHour = o.shiftProgress * hours;
  const FS = 17; // axis / label font size

  // build mock actual curve: monotonic (always rising), varying slope, up to nowHour
  const steps = 16;
  const weights = [];
  for (let i=0;i<steps;i++){ weights.push(0.4 + Math.random()); } // positive-only, varying pace per interval
  const totalWeight = weights.reduce((a,b)=>a+b,0);

  const points = [{ x: 0, y: 0 }];
  let acc = 0;
  for (let i=0;i<steps;i++){
    const hourT = ((i+1)/steps) * nowHour;
    acc += (weights[i]/totalWeight) * o.produced;
    points.push({ x: hourT, y: acc });
  }
  points[points.length-1].y = o.produced; // pin exact end to current count

  const xScale = x => pad.l + (x/hours) * (w - pad.l - pad.r);
  const maxY = Math.max(o.target, o.produced) * 1.1;
  const yScale = y => h - pad.b - (y/maxY) * (h - pad.t - pad.b);

  const actualPath = points.map((p,i) => (i===0?'M':'L') + xScale(p.x).toFixed(1) + ',' + yScale(p.y).toFixed(1)).join(' ');
  const targetY = yScale(o.target);
  const nowX = xScale(nowHour);
  const idealNowY = yScale(o.target * o.shiftProgress);

  // diagonal ideal-pace line: y = (target/hours) * x, from shift start to shift end
  const paceStartX = xScale(0), paceStartY = yScale(0);
  const paceEndX = xScale(hours), paceEndY = yScale(o.target);

  // x-axis: hour gridlines + labels
  let xGrid = '';
  for (let i=0;i<=hours;i+=2){
    const gx = xScale(i);
    xGrid += `<line x1="${gx}" y1="${pad.t}" x2="${gx}" y2="${h-pad.b}" stroke="var(--border)" stroke-width="1"/>`;
    xGrid += `<text x="${gx}" y="${h-pad.b+FS+6}" font-family="JetBrains Mono" font-size="${FS}" fill="var(--text-dim)" text-anchor="middle">${i}h</text>`;
  }

  // y-axis: nice ks gridlines + labels
  const yStep = niceStep(maxY, 4);
  let yGrid = '';
  for (let v=0; v<=maxY; v+=yStep){
    const gy = yScale(v);
    yGrid += `<line x1="${pad.l}" y1="${gy}" x2="${w-pad.r}" y2="${gy}" stroke="var(--border)" stroke-width="1" stroke-opacity="0.6"/>`;
    yGrid += `<text x="${pad.l-10}" y="${gy+FS*0.35}" font-family="JetBrains Mono" font-size="${FS}" fill="var(--text-dim)" text-anchor="end">${Math.round(v)}</text>`;
  }

  holder.innerHTML = `
  <svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" style="overflow:visible">
    ${yGrid}
    ${xGrid}
    <text x="${pad.l-10}" y="${pad.t-4}" font-family="JetBrains Mono" font-size="${FS}" fill="var(--text-dim)" text-anchor="end">ks</text>

    <line x1="${paceStartX}" y1="${paceStartY}" x2="${paceEndX}" y2="${paceEndY}" stroke="var(--text-dim)" stroke-width="1.75" stroke-dasharray="5 4"/>
    <line x1="${pad.l}" y1="${targetY}" x2="${w-pad.r}" y2="${targetY}" stroke="var(--text-dim)" stroke-width="2" stroke-dasharray="2 5"/>
    <text x="${w-pad.r-4}" y="${targetY-8}" font-family="JetBrains Mono" font-size="${FS}" fill="var(--text-dim)" text-anchor="end">kvóta ${o.target}</text>

    <line x1="${nowX}" y1="${pad.t}" x2="${nowX}" y2="${h-pad.b}" stroke="var(--border)" stroke-width="1.5"/>
    <text x="${nowX}" y="${pad.t-4}" font-family="JetBrains Mono" font-size="${FS}" fill="var(--text-dim)" text-anchor="middle">teď</text>

    <path d="${actualPath}" fill="none" stroke="var(--steel)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${nowX}" cy="${yScale(o.produced)}" r="5" fill="var(--steel)"/>
    <text x="${nowX+10}" y="${yScale(o.produced)-8}" font-family="JetBrains Mono" font-size="${FS+1}" font-weight="600" fill="var(--steel)" text-anchor="start">${o.produced}</text>
  </svg>`;
}

function drawDial(holder, cur, need, pst){
  const w = 240, h = 150;
  const cx = w/2, cy = 132, r = 96;
  // scale: 0 .. max, with "need" sitting at 60% of the arc so there is headroom both ways
  const max = Math.max(cur, need) < 0.01 ? 1 : Math.max(cur / 0.9, need / 0.6, 1);
  const A0 = Math.PI, A1 = 0; // 180° sweep, left → right
  const ang = v => A0 + (A1 - A0) * Math.min(1, Math.max(0, v / max));
  const pt = (a, rad) => [cx + rad * Math.cos(a), cy - rad * Math.sin(a)];

  const [ax0, ay0] = pt(A0, r);
  const [ax1, ay1] = pt(A1, r);
  const trackPath = `M ${ax0} ${ay0} A ${r} ${r} 0 0 1 ${ax1} ${ay1}`;

  const na = ang(cur);
  const [nx, ny] = pt(na, r);
  const fillPath = `M ${ax0} ${ay0} A ${r} ${r} 0 0 1 ${nx} ${ny}`;

  const stroke = { green:'var(--green)', amber:'var(--amber)', red:'var(--red)' }[pst];

  // target tick for "potřebné tempo"
  const ta = ang(need);
  const [tx0, ty0] = pt(ta, r - 8);
  const [tx1, ty1] = pt(ta, r + 8);

  // needle
  const [hx, hy] = pt(na, r - 14);
  const [bx, by] = pt(na + Math.PI, 10);

  holder.innerHTML = `
  <svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">
    <path d="${trackPath}" fill="none" stroke="var(--surface-2)" stroke-width="12" stroke-linecap="round"/>
    <path d="${fillPath}" fill="none" stroke="${stroke}" stroke-width="12" stroke-linecap="round"/>
    <line x1="${tx0}" y1="${ty0}" x2="${tx1}" y2="${ty1}" stroke="var(--text)" stroke-width="2.5"/>
    <text x="${tx1}" y="${ty1 - 6}" font-family="JetBrains Mono" font-size="10" fill="var(--text-dim)" text-anchor="middle">cíl</text>
    <line x1="${bx}" y1="${by}" x2="${hx}" y2="${hy}" stroke="var(--text)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="6" fill="var(--text)"/>
  </svg>`;
}

function tickClock(){
  const now = new Date();
  document.getElementById('clock').textContent = now.toLocaleDateString('cs-CZ') + '  ' + now.toLocaleTimeString('cs-CZ');
}
tickClock();
setInterval(tickClock, 1000);

render();
</script>
