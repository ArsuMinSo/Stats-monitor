<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Omnika — Přehled výroby</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #12161B;
    --surface: #1B2129;
    --surface-2: #232A33;
    --border: #2B333D;
    --text: #EDEFF2;
    --text-dim: #7E8A97;
    --green: #4CAF6D;
    --green-dim: #2C4A38;
    --amber: #E3A73C;
    --amber-dim: #4A3D22;
    --red: #E0524A;
    --red-dim: #4A2926;
    --steel: #6C9BC4;
    --font-ui: 'Space Grotesk', sans-serif;
    --font-num: 'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}

  /* status colours are conveyed by background-color; force them to print
     even when the browser's "Background graphics" option is off */
  .tile, .bars, .bars span, .op-track, .op-track div,
  .dot, .simple-bar-outer, .simple-bar-fill{
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    -webkit-font-smoothing: antialiased;
    overflow-x:hidden;
  }
  .app{ min-height:100vh; display:flex; flex-direction:column; }

  /* ---------- header ---------- */
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding: 22px 32px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    gap: 12px;
  }
  .brand{ display:flex; align-items:baseline; gap:14px; }
  .brand .mark{
    font-family: var(--font-num);
    font-weight:700;
    font-size: 15px;
    color: var(--steel);
    letter-spacing: 0.02em;
  }
  .brand h1{ font-size: 20px; font-weight:600; }
  .crumb{ font-size:14px; color:var(--text-dim); display:flex; align-items:center; gap:8px; }
  .crumb button{
    background:none; border:none; color:var(--steel); font-family:var(--font-ui);
    font-size:14px; cursor:pointer; padding:0;
  }
  .crumb button:hover{ text-decoration: underline; }
  .clock{ font-family: var(--font-num); font-size:14px; color:var(--text-dim); text-align:right; }

  main{ flex:1; padding: 28px 32px 40px; }

  /* ---------- home: středisko grid ---------- */
  .section-label{
    font-size: 13px; color: var(--text-dim); margin-bottom:16px;
  }
  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 14px;
  }
  .tile{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 18px;
    cursor:pointer;
    text-align:left;
    color: var(--text);
    font-family: var(--font-ui);
    transition: border-color .15s ease, transform .1s ease;
    position:relative;
    overflow:hidden;
  }
  .tile:hover{ border-color: var(--steel); transform: translateY(-1px); }
  .tile:focus-visible{ outline: 2px solid var(--steel); outline-offset: 2px; }
  /* status stripe as a left border so it always prints (borders ignore the
     browser's "Background graphics" print toggle) */
  .tile.status-green{ border-left: 4px solid var(--green); }
  .tile.status-amber{ border-left: 4px solid var(--amber); }
  .tile.status-red{ border-left: 4px solid var(--red); }

  .tile-code{ font-family: var(--font-num); font-size:22px; font-weight:600; }
  .tile-name{ font-size:13px; color: var(--text-dim); margin-top:2px; margin-bottom:14px; }

  .bars{ display:flex; align-items:flex-end; gap:3px; height:28px; margin-bottom:10px; }
  .bars span{ flex:1; border-radius:1px; border:1px solid transparent; }
  /* border matches the fill so bars still read if a printer drops backgrounds */
  .status-green .bars span{ background: var(--green); border-color: var(--green); }
  .status-amber .bars span{ background: var(--amber); border-color: var(--amber); }
  .status-red .bars span{ background: var(--red); border-color: var(--red); }

  .tile-pct{ font-family: var(--font-num); font-size:15px; font-weight:600; }
  .tile-pct small{ font-family: var(--font-ui); font-weight:400; color: var(--text-dim); font-size:12px; }

  /* ---------- operations grid ---------- */
  .op-tile{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 16px;
    cursor:pointer;
    text-align:left;
    color: var(--text);
    font-family: var(--font-ui);
    display:flex; flex-direction:column; gap:10px;
  }
  .op-tile:hover{ border-color: var(--steel); }
  .op-code{ font-family: var(--font-num); font-size:16px; font-weight:600; display:flex; align-items:center; gap:8px; }
  .dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; border:1px solid transparent; }
  .dot.status-green{ background: var(--green); border-color: var(--green); }
  .dot.status-amber{ background: var(--amber); border-color: var(--amber); }
  .dot.status-red{ background: var(--red); border-color: var(--red); }
  .op-track{ height:6px; background: var(--surface-2); border-radius:3px; overflow:hidden; }
  .op-track div{ height:100%; border-radius:3px; border:1px solid transparent; }
  .status-green .op-track div, .op-track div.status-green{ background: var(--green); border-color: var(--green); }
  .op-meta{ font-family:var(--font-num); font-size:12px; color:var(--text-dim); display:flex; justify-content:space-between; }

  /* ---------- operation view: simple operator display ---------- */
  .simple-view{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height: calc(100vh - 180px);
    gap: 40px;
    padding: 20px;
  }
  .simple-head{
    font-family: var(--font-num); font-size: 20px; color: var(--text-dim);
    letter-spacing: 0.04em;
  }
  .simple-bar-outer{
    width: 100%; max-width: 900px; height: 64px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    overflow: hidden;
  }
  .simple-bar-fill{
    height: 100%; border-radius: 9px 0 0 9px; transition: width .3s ease;
    border: 1px solid transparent;
  }
  .simple-bar-fill.status-green{ background: var(--green); border-color: var(--green); }
  .simple-bar-fill.status-amber{ background: var(--amber); border-color: var(--amber); }
  .simple-bar-fill.status-red{ background: var(--red); border-color: var(--red); }
  .simple-numbers{
    font-family: var(--font-num); font-weight: 700;
    display:flex; align-items:baseline; gap: 16px;
  }
  .simple-current{ font-size: 96px; line-height:1; }
  .simple-current.status-green{ color: var(--green); }
  .simple-current.status-amber{ color: var(--amber); }
  .simple-current.status-red{ color: var(--red); }
  .simple-slash{ font-size: 56px; color: var(--text-dim); }
  .simple-target{ font-size: 56px; color: var(--text-dim); }

  @media (max-width: 600px){
    header, main{ padding-left:18px; padding-right:18px; }
    .simple-current{ font-size: 64px; }
    .simple-slash, .simple-target{ font-size: 36px; }
    .simple-bar-outer{ height: 44px; }
  }

  /* ---------- light theme (toggle in header) ---------- */
  html.light{
    --bg: #FFFFFF;
    --surface: #FFFFFF;
    --surface-2: #ECEFF2;
    --border: #C6CDD4;
    --text: #14181D;
    --text-dim: #4A5560;
    --green: #167A38;
    --green-dim: #DCEDE1;
    --amber: #8A5B0E;
    --amber-dim: #F1E6CF;
    --red: #B02F26;
    --red-dim: #F1DAD7;
    --steel: #1F5C87;
  }

  /* ---------- theme toggle button ---------- */
  .theme-toggle{
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: var(--font-num);
    font-size: 13px;
    padding: 7px 12px;
    border-radius: 5px;
    cursor: pointer;
    line-height: 1;
  }
  .theme-toggle:hover{ border-color: var(--steel); color: var(--text); }
  .theme-toggle:focus-visible{ outline: 2px solid var(--steel); outline-offset: 2px; }
  .header-right{ display:flex; align-items:center; gap:16px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <span class="mark">OMNIKA</span>
      <h1 id="header-title">Výroba — přehled středisek</h1>
    </div>
    <div class="header-right">
      <button class="theme-toggle" id="theme-toggle" type="button" aria-pressed="false">Světlý režim</button>
      <div class="clock" id="clock"></div>
    </div>
  </header>

  <div id="crumb-wrap" style="padding: 14px 32px 0;"></div>

  <main id="main"></main>
</div>

<script>
/* ---------------- mock data ---------------- */
const STREDISKA = [
  { code:'01', name:'Horizontální žaluzie',     ops: genOps('01', ['1','2','3','4', '5', '6', '99.2', '99.3']) },
  { code:'02', name:'Vertikální žaluzie',       ops: genOps('02', ['1','2','3', '99.2']) },
  { code:'04', name:'Panely',                   ops: genOps('04', ['1','2','3', '99.2']) },
  { code:'05', name:'Rolety',                   ops: genOps('05', ['1','2','3','3.1','4','5','6','7','9']) },
  { code:'06', name:'Plisse',                   ops: genOps('06', ['1.1.1','1.1.2','1.2','2.1','2.2','3.1','4.1','5.1','6.1','7.1','99.2']) },
  { code:'07', name:'Dítě proti hmyzu',         ops: genOps('07', ['1','99.2','Insect screens - Balení']) },
  { code:'13', name:'Dřevěné žaluzie',          ops: genOps('13', ['01','02','03']) },
  { code:'17', name:'Kompletace - sady',        ops: genOps('17', ['00']) },
  { code:'56', name:'Venkovní rolety',          ops: genOps('56', ['1','2','3','4','9']) },
  { code:'63', name:'Woven wood',               ops: genOps('63', ['1','2','3','4','5','99.2']) },
  { code:'93', name:'Expedice',                 ops: genOps('93', ['00']) },
  { code:'99', name:'Společná pracoviště',      ops: genOps('99', ['Balení','EC','EC - Předbal','Magnety','Rapid','Sklad']) },
];

function genOps(stredisko, suffixes){
  return suffixes.map(s => {
    const code = stredisko + '_' + s;
    const target = 60 + Math.floor(Math.random()*200);
    const shiftProgress = 0.4 + Math.random()*0.5; // how far into shift we mock as
    const idealAtNow = target * shiftProgress;
    const noise = (Math.random()-0.45) * target * 0.35;
    const produced = Math.max(0, Math.round(idealAtNow + noise));
    return { code, target, produced, shiftProgress };
  });
}

function status(produced, target, shiftProgress){
  const idealAtNow = target * shiftProgress;
  if (idealAtNow <= 0) return 'green';
  const ratio = produced / idealAtNow;
  if (ratio >= 0.95) return 'green';
  if (ratio >= 0.8) return 'amber';
  return 'red';
}

function stredisko_status(s){
  const statuses = s.ops.map(o => status(o.produced, o.target, o.shiftProgress));
  if (statuses.includes('red')) return 'red';
  if (statuses.includes('amber')) return 'amber';
  return 'green';
}

/* ---------------- routing / view state ---------------- */
let view = { screen: 'home', stredisko: null, op: null };
const main = document.getElementById('main');
const crumbWrap = document.getElementById('crumb-wrap');
const headerTitle = document.getElementById('header-title');

function render(){
  crumbWrap.innerHTML = '';
  if (view.screen === 'home'){
    headerTitle.textContent = 'Výroba — přehled středisek';
    renderHome();
  } else if (view.screen === 'ops'){
    const s = STREDISKA.find(x => x.code === view.stredisko);
    headerTitle.textContent = 'Středisko ' + s.code + ' — ' + s.name;
    renderCrumb([{label:'Přehled', go:{screen:'home'}}, {label:'Středisko ' + s.code}]);
    renderOps(s);
  } else if (view.screen === 'graph'){
    const s = STREDISKA.find(x => x.code === view.stredisko);
    const o = s.ops.find(x => x.code === view.op);
    headerTitle.textContent = o.code;
    renderCrumb([
      {label:'Přehled', go:{screen:'home'}},
      {label:'Středisko ' + s.code, go:{screen:'ops', stredisko: s.code}},
      {label: o.code}
    ]);
    renderGraph(s, o);
  }
}

function renderCrumb(items){
  const wrap = document.createElement('div');
  wrap.className = 'crumb';
  items.forEach((it, i) => {
    if (i > 0){
      const sep = document.createElement('span');
      sep.textContent = '/';
      wrap.appendChild(sep);
    }
    if (it.go){
      const btn = document.createElement('button');
      btn.textContent = it.label;
      btn.onclick = () => { view = {...view, ...it.go}; render(); };
      wrap.appendChild(btn);
    } else {
      const span = document.createElement('span');
      span.textContent = it.label;
      span.style.color = 'var(--text)';
      wrap.appendChild(span);
    }
  });
  crumbWrap.appendChild(wrap);
}

function renderHome(){
  main.innerHTML = '';
  const label = document.createElement('div');
  label.className = 'section-label';
  label.textContent = STREDISKA.length + ' středisek — dnešní směna';
  main.appendChild(label);

  const grid = document.createElement('div');
  grid.className = 'grid';

  STREDISKA.forEach(s => {
    const totalProduced = s.ops.reduce((a,o)=>a+o.produced,0);
    const totalTarget = s.ops.reduce((a,o)=>a+o.target,0);
    const pct = Math.round((totalProduced/totalTarget)*100);
    const st = stredisko_status(s);

    const tile = document.createElement('button');
    tile.className = 'tile status-' + st;
    tile.innerHTML = `
      <div class="tile-code">${s.code}</div>
      <div class="tile-name">${s.name}</div>
      <div class="bars">${s.ops.map(o => {
        const h = Math.max(8, Math.min(100, Math.round((o.produced/o.target)*100)));
        return `<span style="height:${h}%"></span>`;
      }).join('')}</div>
      <div class="tile-pct">${pct}% <small>plánu k této chvíli</small></div>
    `;
    tile.onclick = () => { view = { screen:'ops', stredisko: s.code, op:null }; render(); };
    grid.appendChild(tile);
  });

  main.appendChild(grid);
}

function renderOps(s){
  main.innerHTML = '';
  const label = document.createElement('div');
  label.className = 'section-label';
  label.textContent = s.ops.length + ' operací';
  main.appendChild(label);

  const grid = document.createElement('div');
  grid.className = 'grid';

  s.ops.forEach(o => {
    const st = status(o.produced, o.target, o.shiftProgress);
    const pct = Math.min(100, Math.round((o.produced/o.target)*100));
    const tile = document.createElement('button');
    tile.className = 'op-tile';
    tile.innerHTML = `
      <div class="op-code"><span class="dot status-${st}"></span>${o.code}</div>
      <div class="op-track"><div class="status-${st}" style="width:${pct}%"></div></div>
      <div class="op-meta"><span>${o.produced} / ${o.target} ks</span><span>${pct}%</span></div>
    `;
    tile.onclick = () => { view = { screen:'graph', stredisko: s.code, op: o.code }; render(); };
    grid.appendChild(tile);
  });

  main.appendChild(grid);
}

function renderGraph(s, o){
  main.innerHTML = '';
  const st = status(o.produced, o.target, o.shiftProgress);
  const pct = Math.min(100, Math.round((o.produced/o.target)*100));

  const wrap = document.createElement('div');
  wrap.className = 'simple-view';
  wrap.innerHTML = `
    <div class="simple-head">${s.code} · ${o.code}</div>
    <div class="simple-bar-outer">
      <div class="simple-bar-fill status-${st}" style="width:${pct}%"></div>
    </div>
    <div class="simple-numbers">
      <span class="simple-current status-${st}">${o.produced}</span>
      <span class="simple-slash">/</span>
      <span class="simple-target">${o.target} ks</span>
    </div>
  `;
  main.appendChild(wrap);
}

function tickClock(){
  const now = new Date();
  document.getElementById('clock').textContent = now.toLocaleDateString('cs-CZ') + '  ' + now.toLocaleTimeString('cs-CZ');
}
tickClock();
setInterval(tickClock, 1000);

/* ---------------- theme toggle ---------------- */
const themeBtn = document.getElementById('theme-toggle');
function applyTheme(light){
  document.documentElement.classList.toggle('light', light);
  themeBtn.textContent = light ? 'Tmavý režim' : 'Světlý režim';
  themeBtn.setAttribute('aria-pressed', String(light));
  try { localStorage.setItem('meter-theme', light ? 'light' : 'dark'); } catch(e){}
}
let startLight = false;
try { startLight = localStorage.getItem('meter-theme') === 'light'; } catch(e){}
applyTheme(startLight);
themeBtn.onclick = () => applyTheme(!document.documentElement.classList.contains('light'));

render();
</script>
</body>
</html>
